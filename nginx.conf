log_format upstreamlog '$remote_addr - [$time_local] "$request" $status -> upstream: $upstream_addr ($request_time s)';

upstream app_backend {
    # ==========================================================
    # UJI KETIGANYA SECARA BERGANTIAN (G.3.7 & Instruksi Bagian 1):
    # 1. Round Robin      : Hapus/komentari least_conn; dan ip_hash;
    # 2. Least Connection : Aktifkan least_conn; (Pilihan Final)
    # 3. IP Hash          : Aktifkan ip_hash;
    # ==========================================================
    least_conn;
    # ip_hash;
    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstreamlog;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://app_backend/health;
    }
}